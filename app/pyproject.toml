[project]
name = "ml-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Peng-LUH", email = "ethaniel.unihannover@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "prometheus-client>=0.25.0",
    "pydantic>=2.13.4",
    "torch>=2.12.0",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
ml-api = "ml_api.main:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../tests"]
